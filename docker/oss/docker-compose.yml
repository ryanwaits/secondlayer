# Secondlayer OSS — one-box self-host.
#
#   sl init --network mainnet
#   # copy .env.local secrets into .env
#   docker compose up -d
#
# Optional chain:
#   docker compose --profile full-node up -d      # bundled stacks-node + bitcoind
#   docker compose --profile console up -d        # web console UI on :3801
#
# There is no bundled-stacks-node-only profile: a stacks-node needs Bitcoin
# data from somewhere, and we don't wire a public RPC default for it — the
# only bundled node option is full-node (stacks-node + bitcoind together).
#
# Multi-service split (legacy): docker-compose.split.yml

# Third-party images are digest-pinned (`tag@sha256:...`). Tags are mutable, so
# an unpinned stack silently changes underneath an operator between `up -d`
# runs — the exact failure mode that makes a self-hosted deployment
# irreproducible. The tag is kept for human readability; Docker resolves the
# digest. Re-resolve with `docker buildx imagetools inspect <image>:<tag>`.
services:
  postgres:
    image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondlayer}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondlayer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  secondlayer:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      INSTANCE_MODE: oss
      NETWORK: ${NETWORK:-${STACKS_NETWORK:-mainnet}}
      STACKS_NETWORK: ${STACKS_NETWORK:-mainnet}
      NODE_MODE: ${NODE_MODE:-external}
      SECONDLAYER_ALLOW_UNDERSIZED: ${SECONDLAYER_ALLOW_UNDERSIZED:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-secondlayer}@postgres:5432/${POSTGRES_DB:-secondlayer}
      DATA_DIR: /data
      API_PORT: "3800"
      INDEXER_PORT: "3700"
      # In a container the listen host cannot express who can reach the API:
      # it must be 0.0.0.0 or Docker's published port never arrives. The real
      # answer is the publish spec below, so hand the API the same value it is
      # published with. Loopback default -> keyless local reads stay open;
      # override API_PORT with 0.0.0.0:3800 (or any other host) in .env and
      # every /v1 request needs INSTANCE_TOKEN.
      #
      # NOTE: API_PORT above is the *container* port the process listens on;
      # ${API_PORT} in `ports:`/here is the *publish spec* the operator sets in
      # .env. Same name, two meanings — do not collapse them.
      LISTEN_HOST: "0.0.0.0"
      API_PUBLISH_ADDR: ${API_PORT:-127.0.0.1:3800}
      INSTANCE_TOKEN: ${INSTANCE_TOKEN:-}
      SECONDLAYER_SECRETS_KEY: ${SECONDLAYER_SECRETS_KEY:-}
      STREAMS_SIGNING_PRIVATE_KEY: ${STREAMS_SIGNING_PRIVATE_KEY:-}
      SECONDLAYER_WEBHOOK_SIGNING_PRIVATE_KEY: ${SECONDLAYER_WEBHOOK_SIGNING_PRIVATE_KEY:-}
      ALLOW_UNSIGNED_WEBHOOKS: ${ALLOW_UNSIGNED_WEBHOOKS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      STACKS_NODE_RPC_URL: ${STACKS_NODE_RPC_URL:-}
      OBSERVER_JOURNAL_ENABLED: ${OBSERVER_JOURNAL_ENABLED:-true}
      STREAMS_API_URL: http://127.0.0.1:3800
      STREAMS_INTERNAL_API_KEY: ${STREAMS_INTERNAL_API_KEY:-}
      SBTC_DECODER_ENABLED: ${SBTC_DECODER_ENABLED:-true}
      POX4_DECODER_ENABLED: ${POX4_DECODER_ENABLED:-true}
      BNS_DECODER_ENABLED: ${BNS_DECODER_ENABLED:-false}
      SUBGRAPH_SOURCE: ${SUBGRAPH_SOURCE:-streams-index}
      SUBGRAPH_INDEX_API_URL: http://127.0.0.1:3800
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-}
    ports:
      - "${API_PORT:-127.0.0.1:3800}:3800"
      - "${INDEXER_PORT:-127.0.0.1:3700}:3700"
    # `secondlayer observer` (and the wizard's printed stanza) default the
    # endpoint to `indexer:3700` for a bundled/external node reaching this
    # service over the docker network — this alias is what makes that
    # default actually resolve, without renaming the service itself.
    networks:
      default:
        aliases:
          - indexer
    volumes:
      - subgraphs_data:/data/subgraphs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3800/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  console:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: console
    environment:
      SL_API_URL: http://secondlayer:3800
      INSTANCE_TOKEN: ${INSTANCE_TOKEN:-}
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      NODE_ENV: production
    ports:
      - "${CONSOLE_PORT:-3801}:3801"
    depends_on:
      secondlayer:
        # started, not healthy: the console is the tool you reach for when
        # the instance is sick — it must come up while the runtime is red.
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3801/console"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    profiles: ["console"]

  bitcoind:
    # Upstream publishes no version tags — only `latest` and an abandoned 1.0.0
    # — so the digest IS the version pin here. `latest` is retained only as the
    # lookup path; the digest makes it immutable and stops a rebuilt upstream
    # image from swapping the bitcoind binary under a running node.
    # Digest below = kylemanna/bitcoind:latest as published 2026-07-20.
    image: kylemanna/bitcoind:latest@sha256:86bbcaa99bf3bf3d5df7fd6d9217b3a41194db4c4e34385064f2cfc9fa7bdf91
    volumes:
      - ${BITCOIN_DATA_DIR:-./data/bitcoin}:/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:8332:8332"
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -rpcuser=${BITCOIN_RPC_USER:-stacks} -rpcpassword=${BITCOIN_RPC_PASSWORD:-changeme} getblockchaininfo | grep -q '\"blocks\"' && [ $$(bitcoin-cli -rpcuser=${BITCOIN_RPC_USER:-stacks} -rpcpassword=${BITCOIN_RPC_PASSWORD:-changeme} getblockcount) -gt 666050 ]"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32G
    profiles: ["full-node"]

  stacks-node:
    # Consensus-critical: a moved tag here is a node running different fork
    # rules than the indexer was tested against. Digest-pinned to 4.0.1.
    image: ghcr.io/stacks-network/stacks-core:4.0.1@sha256:ceb768f881ef52a1d2792a2b4a89d81e092b1df11293b04c31ce36613c3f9711
    volumes:
      - ${STACKS_DATA_DIR:-./data/stacks}:/stacks-blockchain/data
      - ./Config.toml:/stacks-blockchain/Config.toml:ro
    ports:
      - "20443:20443"
      - "20444:20444"
    restart: unless-stopped
    command: ["stacks-node", "start", "--config", "/stacks-blockchain/Config.toml"]
    # full-node only: a bundled stacks-node needs Bitcoin data from
    # somewhere, and the only source this compose wires up is the bundled
    # bitcoind below (also full-node-only). A standalone "stacks-node,
    # public Bitcoin" profile used to exist here but never pointed the
    # node's Config.toml at any real public Bitcoin RPC — every operator
    # who ran it got a container that couldn't sync.
    profiles: ["full-node"]

volumes:
  postgres_data:
  subgraphs_data:
