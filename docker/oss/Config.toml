# Event observer points directly at the bundled indexer service.
# Same docker network, no reverse proxy needed.
#
# The node waits on each observer before moving on, and by default retries a
# failed delivery until it succeeds, so a slow or down indexer can stall block
# processing. A co-located signer rides the same path and would miss
# block_proposal events. Safe by default: disable_retries skips a failed
# delivery, and timeout_ms bounds each wait.
#
# Tradeoff: a skipped block stays a gap in the index until
# `secondlayer repair --against <manifest> --apply` fills it from the archive.
# A pure indexer with no signer on this node can set disable_retries = false
# and timeout_ms = 2000 (`secondlayer observer --mode indexer`) instead.
#
# events_keys = ["*"] is the only set a stock stacks-core accepts; an unknown
# key panics the node on start.
[[events_observer]]
endpoint = "indexer:3700"
events_keys = ["*"]
timeout_ms = 500
disable_retries = true

[burnchain]
chain = "bitcoin"
mode = "mainnet"
peer_host = "bitcoind"
# Match BITCOIN_RPC_USER / BITCOIN_RPC_PASSWORD in your .env.
# Edit these if you changed the defaults.
username = "stacks"
password = "changeme_bitcoin_rpc_password"
rpc_port = 8332
peer_port = 8333
