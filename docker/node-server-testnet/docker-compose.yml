# Stacks canonical testnet follower + event proxy. Isolated from the mainnet
# project: no shared network, volume, port or depends_on.
name: secondlayer-testnet

services:
  stacks-node:
    image: ghcr.io/stacks-network/stacks-core:4.0.5@sha256:51aa7bf6f990b99fa010ebb23abe78653cf1f1d129ab8e7d88b1fe11a403c97d
    command: ["stacks-node", "start", "--config", "/stacks-blockchain/Config.toml"]
    volumes:
      - /home/stacks-testnet:/stacks-blockchain/data
      - ./Config.toml:/stacks-blockchain/Config.toml:ro
    ports:
      # Same port both sides: DOCKER-USER matches post-DNAT.
      # Gate: testnet-rpc-firewall.service.
      - "37.27.171.220:21443:21443"
    dns: [8.8.8.8, 1.1.1.1]
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4
    ulimits:
      nofile: 65536
    restart: always
    stop_grace_period: 2m
    logging: &logging
      driver: json-file
      options: { max-size: 100m, max-file: "3" }

  event-proxy:
    image: nginx:alpine@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    dns: [8.8.8.8, 1.1.1.1]
    mem_limit: 256m
    cpus: 1
    restart: always
    logging: *logging

configs:
  nginx_conf:
    content: |
      events { worker_connections 64; }
      http {
          access_log off;
          server {
              listen 3700;
              client_max_body_size 100M;
              proxy_buffering on;
              proxy_buffer_size 128k;
              proxy_buffers 4 256k;
              proxy_request_buffering on;
              location / {
                  proxy_pass http://65.21.135.94:3701;
                  proxy_connect_timeout 30s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
          }
      }
