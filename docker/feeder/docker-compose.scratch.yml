# Isolated scratch indexer + postgres (app-server). IBD sink for the feeder.
#
#   cd docker/feeder && docker compose -f docker-compose.scratch.yml up -d
#
# Project name is pinned. Do not merge with docker/docker-compose.yml or
# docker-compose.hetzner.yml (husk risk). Do not add these services to
# deploy.sh APP_SERVICES. Bind is /opt/secondlayer/data/postgres-feeder —
# never /opt/secondlayer/data/postgres.

name: secondlayer-feeder

services:
  postgres-feeder:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondlayer}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_feeder}
    volumes:
      - ${POSTGRES_FEEDER_DATA_DIR:-/opt/secondlayer/data/postgres-feeder}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondlayer} -d ${POSTGRES_DB:-secondlayer_feeder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate-feeder:
    image: ghcr.io/${DEPLOY_IMAGE_OWNER:-ryanwaits}/secondlayer-api:${DEPLOY_IMAGE_TAG:-latest}
    command: ["bun", "run", "packages/shared/src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-secondlayer}@postgres-feeder:5432/${POSTGRES_DB:-secondlayer_feeder}
    depends_on:
      postgres-feeder:
        condition: service_healthy
    restart: "no"

  indexer-feeder:
    image: ghcr.io/${DEPLOY_IMAGE_OWNER:-ryanwaits}/secondlayer-indexer:${DEPLOY_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-secondlayer}@postgres-feeder:5432/${POSTGRES_DB:-secondlayer_feeder}
      PORT: 3700
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      OBSERVER_JOURNAL_ENABLED: ${OBSERVER_JOURNAL_ENABLED:-true}
      TIP_FOLLOWER_ENABLED: ${TIP_FOLLOWER_ENABLED:-true}
      STACKS_NODE_RPC_URL: ${STACKS_NODE_RPC_URL:-http://37.27.171.220:21443}
      # Unset BACKFILL_SOURCE. Do not point this sink at Hiro for vm_events.
    ports:
      # Host bind; restrict to node-server (37.27.171.220) with DOCKER-USER
      # (UFW is bypassed by Docker). Skip live firewall until start.
      - "3711:3700"
    depends_on:
      migrate-feeder:
        condition: service_completed_successfully
      postgres-feeder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3700/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
