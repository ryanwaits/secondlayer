#cloud-config
# workload-host cloud-init (plan 044, step 1). Ubuntu 24.04 base.
#
# Installs Docker + the gVisor `runsc` runtime (registered, not yet the
# default — 046 flips tenant containers to it once handler code actually
# runs inside them), applies unattended security upgrades, and installs the
# firewall rules that stop a tenant network reaching anything but the public
# internet and app-server:443 (Design: "egress: app-server :443 + public
# internet only") and stop a tenant container reaching the HOST itself
# (the gateway, control Postgres, other tenants' loopback-published ports).
#
# The `docker-user-egress.sh` content below is a placeholder, not a copy
# (review fix C — two copies drift): `provision.sh` inlines the ONE source of
# truth, `docker/workload-host/docker-user-egress.sh`, verbatim at render
# time, replacing the placeholder line before this file is ever handed to
# `hcloud server create`. Never hand-edit the placeholder; edit the
# standalone file and re-render.
#
# This file is handed to `hcloud server create --user-data-from-file` by
# `provision.sh`. It never contains a secret — `WORKLOAD_HOST_KEY` and every
# tenant secret are written to disk over SSH after boot, never baked in here.

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - unattended-upgrades
  - iptables-persistent

write_files:
  # DOCKER-USER is the hook point Docker leaves empty for operator rules —
  # anything appended here runs before Docker's own FORWARD rules, so it can
  # refuse tenant egress Docker would otherwise allow. Applied by the runcmd
  # step below, once Docker (and its docker0/bridge networks) exists.
  - path: /opt/workload-host/docker-user-egress.sh
    permissions: "0755"
    content: |
      __DOCKER_USER_EGRESS_SCRIPT__

  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "runtimes": {
          "runsc": {
            "path": "/usr/local/bin/runsc"
          }
        }
      }

runcmd:
  # Docker Engine (official repo — Ubuntu's own `docker.io` package lags).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # gVisor: registered as a docker runtime now (`runsc` in daemon.json,
  # above), not yet the default — Design's trust line only starts to matter
  # once 046 runs customer handler code in a tenant's `api` container.
  - curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
  - >
    echo "deb [signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg]
    https://storage.googleapis.com/gvisor/releases release main"
    > /etc/apt/sources.list.d/gvisor.list
  - apt-get update
  - apt-get install -y runsc
  - systemctl restart docker

  # Unattended security upgrades (Design: "unattended upgrades").
  - dpkg-reconfigure -f noninteractive unattended-upgrades

  # DOCKER-USER egress rules. APP_SERVER_IP is baked in by provision.sh
  # before this file is handed to `hcloud server create` (see its
  # `envsubst` step) — cloud-init has no other way to receive a value at
  # create time without a secrets store this host doesn't have yet.
  - APP_SERVER_IP="__APP_SERVER_IP__" /opt/workload-host/docker-user-egress.sh

  # Root-only directories the provisioner (`packages/workload`) expects.
  - mkdir -p /opt/secondlayer-workload/tenants
  - chmod 700 /opt/secondlayer-workload/tenants

final_message: "workload-host cloud-init complete after $UPTIME seconds"
