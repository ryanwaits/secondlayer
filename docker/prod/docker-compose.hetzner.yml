# Hetzner AX52 override — extends base docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.hetzner.yml up -d
#
# Data paths (configurable via .env):
#   DATA_DIR         - base data directory (default: /opt/secondlayer/data)
#
# Note: stacks-node + bitcoind run on a separate node server.
# See docker/hosts/node-server/ for node server setup.

# Shared by both WAL-G sidecars; each adds its own prefix, host and database.
x-walg-environment: &walg-environment
  # A scoped R2 token for the private backup bucket only. Never the Streams
  # dump credential: that one writes the public bucket.
  AWS_ACCESS_KEY_ID: ${WALG_R2_ACCESS_KEY_ID:?set WALG_R2_ACCESS_KEY_ID (scoped to the backup bucket)}
  AWS_SECRET_ACCESS_KEY: ${WALG_R2_SECRET_ACCESS_KEY:?set WALG_R2_SECRET_ACCESS_KEY}
  # The endpoint is the account's R2 host, not a secret; reusing it is fine.
  AWS_ENDPOINT: ${WALG_R2_ENDPOINT:-${STREAMS_BULK_R2_ENDPOINT:?set WALG_R2_ENDPOINT}}
  # Client-side encryption: R2 only ever holds ciphertext.
  WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?set WALG_LIBSODIUM_KEY (openssl rand -base64 32)}
  WALG_LIBSODIUM_KEY_TRANSFORM: base64
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_REGION: auto
  WALG_COMPRESSION_METHOD: zstd
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-secondlayer}
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  # Must equal Postgres's own data_directory — wal-g backup-push refuses if
  # the path differs from what Postgres reports. So mount at the same path.
  PGDATA: /var/lib/postgresql/data
  RETAIN_FULL: ${WALG_RETAIN_FULL:-4}
  BACKUP_INTERVAL_SECS: ${WALG_BACKUP_INTERVAL_SECS:-604800}

services:
  # Control-plane DB. Persist to the host DATA_DIR (the base compose only
  # declares a named volume). Holds what cannot be re-derived from the chain
  # (accounts, api keys, billing ledger, subgraph registry), so it archives WAL
  # and `walg-backup-platform` ships it offsite. The chain DB is external
  # (SOURCE_DATABASE_URL, db-server). The host dir
  # $DATA_DIR/wal_archive_platform must exist and be owned by 70:70 before the
  # first start: docker creates a missing bind dir as root, the archive `cp`
  # then fails, and WAL piles up in pg_wal.
  postgres-platform:
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test -f /wal_archive/%f || cp %p /wal_archive/%f"
      - "-c"
      - "archive_timeout=300"
    volumes:
      - ${DATA_DIR:-/opt/secondlayer/data}/postgres-platform:/var/lib/postgresql/data
      - ${DATA_DIR:-/opt/secondlayer/data}/wal_archive_platform:/wal_archive

  # Offsite backups for the control-plane DB: ships the WAL postgres-platform
  # archives to /wal_archive up to R2 and takes periodic base backups. Its prefix
  # is WALG_S3_PREFIX plus `-platform`. Encrypts client-side; WALG_S3_PREFIX must
  # point at a PRIVATE bucket, separate from the public dumps bucket.
  walg-backup-platform:
    build:
      context: ../walg
    restart: unless-stopped
    depends_on:
      postgres-platform:
        condition: service_healthy
    environment:
      <<: *walg-environment
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:?set WALG_S3_PREFIX}-platform
      PGHOST: postgres-platform
      PGDATABASE: ${POSTGRES_PLATFORM_DB:-secondlayer_platform}
    volumes:
      - ${DATA_DIR:-/opt/secondlayer/data}/postgres-platform:/var/lib/postgresql/data:ro
      - ${DATA_DIR:-/opt/secondlayer/data}/wal_archive_platform:/wal_archive

  api:
    environment:
      # The tx-inclusion proof route fetches signed block headers from the node's
      # /v3/blocks; default to the same node the indexer uses so proofs work
      # without a .env entry.
      STACKS_NODE_RPC_URL: ${STACKS_NODE_RPC_URL:-http://37.27.171.220:20443}
      PROOF_SIDECAR_URL: ${PROOF_SIDECAR_URL:-http://37.27.171.220:20450}
      # Bitcoin tx proofs (/v1/proofs/bitcoin-tx): same read-only bitcoind the decoder uses.
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-}
      BITCOIN_RPC_USERNAME: ${BITCOIN_RPC_USERNAME:-}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-}
      # Reorg-safety margin (blocks) the public Streams tip is held back from the
      # raw tip. Matches the code default; pinned here so it's tunable without a
      # redeploy (deploys git reset --hard, so prod stays in sync). Raising it
      # trades latency for reorg safety; the decoder/consumer rewind on reorg.
      STREAMS_TIP_REORG_MARGIN_BLOCKS: "2"
    volumes:
      - ${DATA_DIR:-/opt/secondlayer/data}/views:/data/subgraphs
    deploy:
      # N>1 replicas behind Caddy → rolling, zero-502 deploys + a single
      # replica recreate never stalls the streams-index processors (they reach
      # api over round-robin Docker DNS). 2× the 2G limit = 4G api headroom.
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          memory: 2G

  indexer:
    environment: &indexer-hetzner-env
      STACKS_NODE_RPC_URL: ${STACKS_NODE_RPC_URL:-http://37.27.171.220:20443}
      TIP_FOLLOWER_ENABLED: ${TIP_FOLLOWER_ENABLED:-true}
      AUTO_BACKFILL_ENABLED: ${AUTO_BACKFILL_ENABLED:-true}
      ARCHIVE_DIR: /data/archive
      # The staging dir doubles as the public archive tree (caddy bind-mounts it
      # read-only at /srv/archive), so promote/status mirror their pointers here
      # as well as to the bucket. Same directory, container-side path.
      ARCHIVE_PUBLIC_DIR: /data/archive/canonical-v1-staging
    volumes: &indexer-hetzner-volumes
      - ${DATA_DIR:-/opt/secondlayer/data}/archive:/data/archive

  archive-job:
    environment: *indexer-hetzner-env
    volumes: *indexer-hetzner-volumes

  decoder:
    deploy:
      resources:
        limits:
          memory: 512M
          # Observed at 202% CPU while writes_per_minute:0 (idle but CPU-hot —
          # separate bug worth investigating). Capped so it can't starve api
          # regardless.
          cpus: "1.5"

  caddy:
    # Pinned (a floating tag drifted to 2.10.2 in prod already and caused a
    # Host-header outage on /api/webhooks) — `header_up Host` in the Caddyfile
    # is valid on both 2.10 and 2.11+, so this isn't blocking an upgrade.
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - ${DATA_DIR:-/opt/secondlayer/data}/archive/canonical-v1-staging:/srv/archive:ro
      - ${DATA_DIR:-/opt/secondlayer/data}/workload-host-ca.crt:/etc/caddy/workload-host-ca.crt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-secondlayer.tools}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-ryan.waits@gmail.com}
      WORKLOAD_HOST_IP: ${WORKLOAD_HOST_IP:-2.28.108.204}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
