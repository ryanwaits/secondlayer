<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500&family=Public+Sans:wght@400;500&family=Fira+Code:wght@400;500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f0ebdd;color:#1c1a16;font-family:"Public Sans",sans-serif;position:relative}
canvas{position:absolute;inset:0}
.top{position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:10px;font-size:22px}
.top b{font-weight:500}.top span{color:rgba(28,26,22,.45)}
.name{position:absolute;left:76px;top:200px;font-family:Sora;font-weight:500;font-size:168px;line-height:.9;letter-spacing:-.05em}
.name i{font-style:normal;color:#b8890a}
.tag{position:absolute;left:80px;top:400px;font-size:30px;line-height:1.35;color:rgba(28,26,22,.6);width:640px}
.tag b{font-weight:500;color:#1c1a16}
.cmd{position:absolute;right:80px;top:64px;font:500 20px "Fira Code",monospace;color:#1c1a16;background:#fffdf8;border:1px solid rgba(28,26,22,.12);border-radius:12px;padding:16px 22px}
.cmd span{color:rgba(28,26,22,.4)}
.url{position:absolute;right:80px;bottom:56px;font:500 16px "Fira Code",monospace;letter-spacing:.06em;color:rgba(28,26,22,.45)}
</style></head><body>
<canvas id="c" width="2400" height="1260" style="width:1200px;height:630px"></canvas>
<div class="top"><svg width="24" height="16" viewBox="6 9 36 24" fill="#1c1a16"><polygon points="8,23 28,15 40,23 20,31" opacity=".24"/><polygon points="8,19 28,11 40,19 20,27"/></svg><b>secondlayer</b><span>presents</span></div>
<div class="cmd"><span>$</span> bun add @secondlayer/stacks</div>
<div class="name">stacks<i>.</i></div>
<div class="tag">Build reliable apps &amp; libraries with <b>lightweight</b>, <b>composable</b>, and <b>type-safe</b> modules that interface with Stacks and Bitcoin</div>
<div class="url">STACKS.SECONDLAYER.TOOLS</div>
<script>
(function(){var c=document.getElementById('c'),g=c.getContext('2d');g.scale(2,2);var W=1200,H=630,rgb='28,26,22';
function mul(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var r=mul(7),bands=[];for(var y=90;y<H+40;){var th=26+r()*40;bands.push({y:y,th:th,ph:r()*6,amp:6+r()*10,f:1/(140+r()*120)});y+=th}
function bound(b,x){return b.y+Math.sin(x*b.f*6.28+b.ph)*b.amp+Math.sin(x*b.f*2.1+b.ph*1.7)*b.amp*.5}
var left=520;g.lineWidth=1;
bands.forEach(function(b,i){g.strokeStyle='rgba('+rgb+',.18)';g.beginPath();for(var x=left;x<=W;x+=4){var yy=bound(b,x);x===left?g.moveTo(x,yy):g.lineTo(x,yy)}g.stroke();
var dense=i%3===0?5:i%3===1?9:14,slant=i%2?.5:-.5;g.strokeStyle='rgba('+rgb+',.1)';for(var x0=left;x0<W+60;x0+=dense){g.beginPath();g.moveTo(x0,bound(b,x0)+2);g.lineTo(x0+slant*b.th,bound(b,x0)+b.th-2);g.stroke()}});
g.globalCompositeOperation='destination-in';var m=g.createRadialGradient(900,330,60,900,330,700);m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(.55,'rgba(0,0,0,.7)');m.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=m;g.fillRect(0,0,W,H);
g.globalCompositeOperation='destination-out';var lm=g.createLinearGradient(0,0,700,0);lm.addColorStop(0,'rgba(0,0,0,1)');lm.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=lm;g.fillRect(0,0,700,H);
})();
</script></body></html>
