name: Orphan Subgraph Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

concurrency:
  group: orphan-subgraph-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # continue-on-error + retry: transient GitHub API 503s during setup must not page as failures
      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3.10"
      - uses: oven-sh/setup-bun@v2
        if: steps.setup-bun.outcome == 'failure'
        with:
          bun-version: "1.3.10"
      - name: Check for orphaned subgraph sources
        env:
          TARGET_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
          FIRST_PARTY_ACCOUNT_ID: ${{ vars.FIRST_PARTY_ACCOUNT_ID }}
        run: bun scripts/ci/check-orphan-subgraphs.ts
