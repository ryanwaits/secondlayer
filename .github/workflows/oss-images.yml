name: OSS Images

# Publish OSS Docker images to GitHub Container Registry.
# - Git tags matching `v*` publish `:<tag>` (e.g. v1.0.0) + `:latest`.
# - Manual runs via workflow_dispatch.
# Not built on every push — the deploy workflow covers prod; these exist for
# self-hosters, who only need tagged releases.
# Images: ghcr.io/<owner>/secondlayer-{api,indexer,worker,decoder,subgraph-processor,webhook-processor,runtime,bitcoin}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ vars.DEPLOY_IMAGE_OWNER || github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          [
            api,
            indexer,
            worker,
            decoder,
            subgraph-processor,
            webhook-processor,
            runtime,
            bitcoin,
          ]
        # Thin targets (FROM api / FROM indexer) reuse the base build cache scope.
        include:
          - service: decoder
            base: indexer
          - service: subgraph-processor
            base: api
          - service: webhook-processor
            base: api

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compute API source digest
        id: api-source
        shell: bash
        run: |
          set -euo pipefail
          digest="$(
            git ls-tree -r HEAD -- \
              package.json \
              bun.lock \
              tsconfig.json \
              docker/Dockerfile \
              packages/stacks \
              packages/shared \
              packages/subgraphs \
              packages/bundler \
              packages/sdk \
              packages/scaffold \
              packages/mcp \
              packages/api \
              | git hash-object --stdin
          )"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Multi-arch: self-hosters on Apple Silicon or arm64 servers (AWS
      # Graviton, etc.) otherwise get "no matching manifest" and can't pull
      # any image at all — confirmed by hitting exactly that pulling
      # secondlayer-runtime on an arm64 host. QEMU emulates arm64 on the
      # amd64 GitHub runner so buildx can cross-compile it; both this repo's
      # digest-pinned base images (oven/bun, node:22-alpine) already publish
      # arm64 manifests, so nothing else in the Dockerfile blocks this.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/secondlayer-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SECONDLAYER_API_SOURCE_DIGEST=${{ steps.api-source.outputs.digest }}
          # SBOM + max provenance: a self-hoster running our image needs to be
          # able to answer "what is in this, and what built it" without trusting
          # us. Both are pushed to ghcr as OCI attestations alongside the image,
          # which means the pushed artifact is an image index rather than a bare
          # manifest — Docker 20.10+/BuildKit handle that transparently.
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            ${{ matrix.base && format('type=gha,scope={0}', matrix.base) || '' }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # One file per matrix leg; the release job merges them into the manifest.
      # Recorded unconditionally so a workflow_dispatch run still shows what it
      # published — only the release/signing job is gated on tags.
      - name: Record published digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s  %s\n' \
            '${{ steps.build.outputs.digest }}' \
            '${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/secondlayer-${{ matrix.service }}' \
            > "digests/${{ matrix.service }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.txt
          retention-days: 7
          if-no-files-found: error

  # Inventory + signature for a tagged release. Split out of the matrix so
  # checksums.txt covers every service in one signed document, and so signing
  # credentials (OIDC) live in exactly one job.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach checksums.txt to the GitHub release
      packages: write # cosign pushes signatures beside the images in ghcr
      id-token: write # keyless signing: mint the OIDC token cosign exchanges

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Build checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Secondlayer OSS images — ${GITHUB_REF_NAME}"
            echo "# commit: ${GITHUB_SHA}"
            echo "# run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "#"
            echo "# <digest>  <image>   — pull by digest, never by tag:"
            echo "#   docker pull <image>@<digest>"
            # Sorted so the file is byte-stable across runs regardless of the
            # order the matrix legs happened to finish in.
            LC_ALL=C sort digests/*.txt
          } > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless (Fulcio/Rekor): no long-lived key to rotate or leak. The
      # signing identity is this workflow file at this ref, which is what
      # `cosign verify` checks — see docker/oss/README.md.
      - name: Sign images
        shell: bash
        run: |
          set -euo pipefail
          # Skip comment lines; sign each image by digest, never by tag.
          # `|| true` because grep exits 1 on no match, which pipefail would
          # turn into a failed step.
          { grep -v '^#' checksums.txt || true; } | while read -r digest image; do
            [ -n "${digest:-}" ] || continue
            echo "signing ${image}@${digest}"
            cosign sign --yes "${image}@${digest}"
          done

      - name: Sign checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Upload signed manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
          if-no-files-found: error

      # Best-effort: the tag may be pushed before the GitHub release exists.
      # A missing release must not fail a run whose images already published.
      - name: Attach to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh has no git remote to infer from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              checksums.txt checksums.txt.sig checksums.txt.pem --clobber
          else
            echo "No GitHub release for $GITHUB_REF_NAME; artifacts remain on the workflow run."
          fi
